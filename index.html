<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repositório Institucional IFBA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #006C4F;
            --primary-light: #0E9F6E;
            --primary-soft: #E8F5F0;
            --background: #F8FAFC;
            --surface: #FFFFFF;
            --text: #0F172A;
            --text-light: #64748b;
            --border: #E2E8F0;
            --shadow: 0 10px 25px rgba(15,23,42,.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #f0fdf4 0%, #f8fafc 300px);
            color: var(--text);
            padding: 30px;
        }

        /* HEADER / HERO */
        .hero {
            background: linear-gradient(135deg, #006C4F, #0E9F6E);
            color: white;
            padding: 40px;
            border-radius: 24px;
            margin-bottom: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,.12);
        }

        .hero h1 { font-size: 2rem; margin-bottom: 10px; }
        .hero p { opacity: .9; max-width: 700px; }

        /* STATS */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat {
            background: white;
            border-radius: 18px;
            padding: 22px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
        }

        .stat span {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .stat small {
            color: var(--text-light);
            margin-top: 5px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* FILTROS */
        .filtros {
            background: white;
            padding: 24px;
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 35px;
        }

        .filtros input,
        .filtros select {
            height: 48px;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0 15px;
            font-size: .95rem;
            background: #fff;
            outline: none;
            transition: all 0.2s;
        }

        .filtros input:focus,
        .filtros select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 108, 79, 0.14);
        }

        /* GRID E CARDS */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        .card {
            background: white;
            border-radius: 22px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: .25s;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 35px rgba(0,0,0,.10);
        }

        .card-top {
            height: 8px;
            width: 100%;
        }

        .card-content {
            padding: 24px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .badge {
            align-self: flex-start;
            background: #ECFDF5;
            color: #065F46;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: .75rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .card h2 {
            font-size: 1.1rem;
            line-height: 1.4;
            margin-bottom: 20px;
            color: var(--text);
        }

        .meta {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            margin-top: auto;
        }

        .meta-item {
            display: flex;
            justify-content: space-between;
            color: var(--text-light);
            font-size: .9rem;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 4px;
        }

        .meta-item strong {
            color: var(--text);
        }

        .botao {
            display: block;
            text-align: center;
            text-decoration: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            transition: .2s;
            background: var(--primary);
            color: white;
        }

        .botao:hover {
            background: #00513b;
        }

        .sem-resultados {
            grid-column: 1 / -1;
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 20px;
            border: 1px solid var(--border);
            color: var(--text-light);
        }

        @media(max-width:768px){
            body { padding: 15px; }
            .hero { padding: 25px; }
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: white;
            width: 100%;
            max-width: 100vw;
            height: 95vh;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            animation: modalEntrada 0.3s ease-out;
        }

        @keyframes modalEntrada {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-header {
            padding: 15px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
        }

        .modal-header h3 {
            font-size: 1.1rem;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 85%;
        }

        .modal-close {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--text-light);
            cursor: pointer;
            transition: color 0.2s;
            line-height: 1;
        }

        .modal-close:hover {
            color: #ef4444;
        }

        #iframeDocumento {
            width: 100%;
            flex-grow: 1;
            border: none;
            background: #f1f5f9;
        }

        button.botao {
            border: none;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

<header class="hero">
    <div class="hero-content">
        <h1>Documentos Acadêmicos IFBA</h1>
        <p>Acesse PPCs, Regulamentos, Resoluções, Portarias e demais documentos institucionais.</p>
    </div>
</header>

<div class="stats">
    <div class="stat">
        <span id="docsCount">0</span>
        <small>Documentos</small>
    </div>
    <div class="stat">
        <span id="campiCount">0</span>
        <small>Campi</small>
    </div>
    <div class="stat">
        <span id="cursoCount">0</span>
        <small>Cursos</small>
    </div>
</div>

<div class="filtros">
    <input type="text" id="busca" placeholder="Pesquisar por título, curso ou categoria...">
    <select id="filtroCampus"><option value="">Todos os Campi</option></select>
    <select id="filtroCurso" disabled><option value="">Selecione o campus primeiro</option></select>
    <select id="filtroCategoria"><option value="">Todas as Categorias</option></select>
</div>

<div id="resultado" class="cards"></div>

<div id="modalDocumento" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="tituloModal">Visualizar Documento</h3>
            <span class="modal-close" onclick="fecharModal()">&times;</span>
        </div>
        <iframe id="iframeDocumento" src="" allow="autoplay"></iframe>
    </div>
</div>

<script>
const API_URL = "https://opensheet.elk.sh/1pKmuBqHYkf1AgmJRo_ZURs4PGqJPrLjDDlIeVkjJo5g/dados";
let dados = [];
let dadosExibidos = []; // CORREÇÃO 2: Nova variável para controlar o arquivo correto no modal filtrado

function atualizarEstatisticas(lista = dados){
    document.getElementById("docsCount").innerText = lista.length;
    document.getElementById("campiCount").innerText = new Set(lista.map(d => d.campus).filter(Boolean)).size;
    document.getElementById("cursoCount").innerText = new Set(lista.map(d => d.curso).filter(Boolean)).size;
}

async function carregarDados(){
    try {
        const resposta = await fetch(API_URL);
        dados = await resposta.json();
        dadosExibidos = [...dados]; // Inicializa os dados exibidos
        preencherFiltros();
        atualizarEstatisticas(dados);
        renderizarCards(dados);
    } catch(erro) {
        console.error(erro);
        document.getElementById("resultado").innerHTML = `
            <div class="sem-resultados">Erro ao carregar os dados do repositório.</div>
        `;
    }
}

function atualizarCategorias(){
    const campus = document.getElementById("filtroCampus").value;
    const curso = document.getElementById("filtroCurso").value;
    const categoriaSelect = document.getElementById("filtroCategoria");
    const categoriaAtual = categoriaSelect.value;

    categoriaSelect.innerHTML = `<option value="">Todas as Categorias</option>`;

    let base = [...dados];
    if(campus) base = base.filter(item => item.campus === campus);
    if(curso) base = base.filter(item => item.curso === curso);

    const categories = [...new Set(base.map(item => item.categoria).filter(Boolean))].sort();

    categories.forEach(cat => {
        categoriaSelect.innerHTML += `<option value="${cat}">${cat}</option>`;
    });

    if(categories.includes(categoriaAtual)){
        categoriaSelect.value = categoriaAtual;
    }
}

function gerarCorCampus(campus){
    const cores = ["#006C4F", "#0E9F6E", "#14B8A6", "#0EA5E9", "#3B82F6", "#8B5CF6", "#EC4899"];
    let soma = 0;
    const str = campus || "padrão";
    for(let i=0; i<str.length; i++){
        soma += str.charCodeAt(i);
    }
    return cores[soma % cores.length];
}

function preencherFiltros(){
    const campusSelect = document.getElementById("filtroCampus");
    const campi = [...new Set(dados.map(d => d.campus).filter(Boolean))].sort();
    
    campi.forEach(campus => {
        campusSelect.innerHTML += `<option value="${campus}">${campus}</option>`;
    });
    
    atualizarCategorias();
}

function atualizarCursosPorCampus(){
    const campus = document.getElementById("filtroCampus").value;
    const cursoSelect = document.getElementById("filtroCurso");

    cursoSelect.innerHTML = "";

    if(!campus){
        cursoSelect.disabled = true;
        cursoSelect.innerHTML = `<option value="">Selecione o campus primeiro</option>`;
        atualizarCategorias();
        aplicarFiltros();
        return;
    }

    cursoSelect.disabled = false;
    cursoSelect.innerHTML = `<option value="">Todos os cursos</option>`;

    const cursos = [...new Set(dados.filter(item => item.campus === campus).map(item => item.curso).filter(Boolean))].sort();

    cursos.forEach(curso => {
        cursoSelect.innerHTML += `<option value="${curso}">${curso}</option>`;
    });

    atualizarCategorias();
    aplicarFiltros();
}

function renderizarCards(lista){
    const container = document.getElementById("resultado");

    if(lista.length === 0){
        container.innerHTML = `<div class="sem-resultados">Nenhum documento encontrado.</div>`;
        return;
    }

    container.innerHTML = "";

    lista.forEach((item, index) => {
        const corCard = gerarCorCampus(item.campus);

        container.innerHTML += `
        <div class="card">
            <div class="card-top" style="background-color: ${corCard}"></div>
            <div class="card-content">
                <div class="badge">${item.categoria || "Documento"}</div>
                <h2>${item.titulo}</h2>
                <div class="meta">
                    <div class="meta-item"><span>Campus</span><strong>${item.campus}</strong></div>
                    <div class="meta-item"><span>Curso</span><strong>${item.curso || "Geral"}</strong></div>
                    <div class="meta-item"><span>Modalidade</span><strong>${item.modalidade || "-"}</strong></div>
                </div>
                <button onclick="abrirModal(${index})" class="botao">Visualizar</button>
            </div>
        </div>
        `;
    });
}

function abrirModal(index) {
    // CORREÇÃO 2: Pega o item de 'dadosExibidos' em vez de 'dados' global bruto
    const item = dadosExibidos[index]; 
    if (!item || !item.link_drive) return;

    const modal = document.getElementById("modalDocumento");
    const iframe = document.getElementById("iframeDocumento");
    const tituloModal = document.getElementById("tituloModal");

    let urlEmbed = item.link_drive;
    if (urlEmbed.includes("drive.google.com")) {
        urlEmbed = urlEmbed.replace("/view", "/preview").replace("/edit", "/preview");
    }

    tituloModal.innerText = item.titulo || "Visualizar Documento";
    iframe.src = urlEmbed;

    modal.classList.add("active");
    document.body.style.overflow = "hidden";
}

function fecharModal() {
    const modal = document.getElementById("modalDocumento");
    const iframe = document.getElementById("iframeDocumento");

    iframe.src = "";
    modal.classList.remove("active");
    document.body.style.overflow = "";
}

// Isso agora funciona perfeitamente porque o modal HTML está acima deste script!
document.getElementById("modalDocumento").addEventListener("click", function(e) {
    if (e.target === this) {
        fecharModal();
    }
});

function aplicarFiltros(){
    const busca = document.getElementById("busca").value.toLowerCase();
    const campus = document.getElementById("filtroCampus").value;
    const categoria = document.getElementById("filtroCategoria").value;
    const curso = document.getElementById("filtroCurso").value || "";
    
    const filtrados = dados.filter(item => {
        const matchBusca = (item.titulo || "").toLowerCase().includes(busca) || 
                           (item.curso || "").toLowerCase().includes(busca) ||
                           (item.categoria || "").toLowerCase().includes(busca);

        const matchCurso = !curso || (item.curso || "").trim() === curso.trim();
        const matchCampus = !campus || (item.campus || "").trim() === campus.trim();
        const matchCategoria = !categoria || (item.categoria || "").trim() === categoria.trim();

        return matchBusca && matchCampus && matchCurso && matchCategoria;
    });

    dadosExibidos = [...filtrados]; // CORREÇÃO 2: Atualiza os dados que estão visíveis na tela
    renderizarCards(filtrados);
    atualizarEstatisticas(filtrados); 
}

// EVENTOS
document.getElementById("busca").addEventListener("input", aplicarFiltros);
document.getElementById("filtroCampus").addEventListener("change", atualizarCursosPorCampus);
document.getElementById("filtroCategoria").addEventListener("change", aplicarFiltros);
document.getElementById("filtroCurso").addEventListener("change", () => {
    atualizarCategorias();
    aplicarFiltros();
});

carregarDados();
</script>
</body>
</html>
